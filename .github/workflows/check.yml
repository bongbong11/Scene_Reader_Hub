name: Hub compatibility and browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, compatibility and regression tests
        run: node scripts/check.mjs
      - name: GitHub installation verification
        run: python scripts/release-check.py
      - name: Browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Browser lifecycle and user flows
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: artifacts/
